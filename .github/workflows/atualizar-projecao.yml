name: Atualizar projeção da CCEE

on:
  schedule:
    # Terças e quintas, 10h de Brasília (13h UTC). O encontro é quinzenal.
    - cron: '0 13 * * 2,4'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Verificar nova edição do Encontro do PLD
        id: check
        run: xvfb-run -a python scripts/atualizar-projecao.py

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Gerar página estática
        run: node scripts/gerar-dados-estaticos.mjs

      - name: Commit e push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projecao.json index.html dados.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Nada a atualizar — link já é o mais recente."
          else
            git commit -m "Atualiza link da projeção da CCEE"
            git push
          fi

      - name: Abrir issue se o resumo estiver defasado
        if: steps.check.outputs.desatualizado == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITULO="Atualizar resumo da projeção da CCEE (${{ steps.check.outputs.edicao }})"
          EXISTENTES=$(gh issue list --state open \
            --search "Atualizar resumo da projeção da CCEE in:title" \
            --json number --jq 'length')
          if [ "$EXISTENTES" = "0" ]; then
            gh issue create --title "$TITULO" --body "A CCEE publicou uma nova edição do Encontro do PLD. Atualize em \`data/projecao.json\` os campos \`resumo\`, \`destaques\`, \`ressalva\`, \`pagina\`, \`resumoEdicao\` e \`atualizadoEm\` (e o fallback correspondente em \`index.html\`), depois feche esta issue."
          fi
